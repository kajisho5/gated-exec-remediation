<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="t d"><title id="t">GER processing flow</title><desc id="d">Gated-Exec Remediation: the plan, approval and allowlist are checked by gates G-1 to G-8, chmod runs after a dry-run, and everything is rolled back on failure</desc><defs><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs><rect width="100%" height="100%" fill="#0a0a0a"/><text x="40" y="52" font-size="24" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">GER — Gated-Exec Remediation processing flow</text>
<text x="40" y="80" font-size="14" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Remediation layer. The only one of the 3 layers that makes changes. Executes only operations that pass every gate (first version: chmod only)</text>
<rect x="40" y="112" width="280" height="180" rx="12" fill="#141414" stroke="#38bdf8" stroke-width="1"/>
<rect x="40" y="124" width="3" height="156" rx="1.5" fill="#38bdf8"/>
<text x="56" y="138" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Input ger-input.json</text>
<text x="56" y="162" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">plan (finalized by ZET)</text>
<text x="56" y="182" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">approval{plan_id, approved_by,</text>
<text x="56" y="202" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">  approved_at, approval_token}</text>
<text x="56" y="222" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">mode: dry-run | apply</text>
<text x="56" y="242" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">allowed_actions</text>
<text x="56" y="262" font-size="12" font-weight="400" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">--operator &lt;name&gt; (required)</text>
<rect x="380" y="112" width="340" height="452" rx="12" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
<text x="396" y="140" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Gates (if any fails, nothing changes)</text>
<rect x="394" y="160" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="185" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-1</text>
<text x="452" y="185" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">schema, pinned version, no findings</text>
<path d="M550,200 L550,209" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="209" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="234" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-2</text>
<text x="452" y="234" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">plan.status is ok / partial</text>
<path d="M550,249 L550,258" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="258" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="283" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-3</text>
<text x="452" y="283" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">plan_id matches, token == plan_hash</text>
<path d="M550,298 L550,307" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="307" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="332" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-4</text>
<text x="452" y="332" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">operator is not an approver</text>
<path d="M550,347 L550,356" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="356" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="381" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-5</text>
<text x="452" y="381" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">in allowed_actions and supported</text>
<path d="M550,396 L550,405" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="405" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="430" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-6</text>
<text x="452" y="430" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">reversible:false needs 2 approvers</text>
<path d="M550,445 L550,454" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="454" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="479" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-7</text>
<text x="452" y="479" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">pre-validate every target (lstat)</text>
<path d="M550,494 L550,503" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="503" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="528" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-8</text>
<text x="452" y="528" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">dry-run record of the plan (apply)</text>
<path d="M320,200 L378,200" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#as)"/>
<rect x="380" y="600" width="340" height="110" rx="12" fill="#2a0f0f" stroke="#ef4444" stroke-width="1"/>
<rect x="380" y="612" width="3" height="86" rx="1.5" fill="#ef4444"/>
<text x="396" y="626" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Rejected (exit code 3)</text>
<text x="396" y="650" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">nothing changes</text>
<text x="396" y="670" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">rejecting gates recorded in the audit log</text>
<text x="396" y="690" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">unsupported operation: whole plan rejected</text>
<path d="M550,564 L550,598" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="560" y="586" font-size="11" font-weight="500" fill="#ef4444" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">any fails</text>
<rect x="780" y="112" width="220" height="170" rx="12" fill="#141414" stroke="#eab308" stroke-width="1"/>
<rect x="780" y="124" width="3" height="146" rx="1.5" fill="#eab308"/>
<text x="796" y="138" font-size="14" font-weight="600" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">ger dry-run</text>
<text x="796" y="162" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">computes before / after</text>
<text x="796" y="182" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">changes nothing</text>
<text x="796" y="202" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">plan_hash and input_hash</text>
<text x="796" y="222" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">  recorded in the audit log</text>
<path d="M720,180 L778,180" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#as)"/>
<text x="726" y="172" font-size="11" font-weight="500" fill="#8a8a8a" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">all pass</text>
<rect x="1040" y="112" width="200" height="170" rx="12" fill="#141414" stroke="#22c55e" stroke-width="1"/>
<rect x="1040" y="124" width="3" height="146" rx="1.5" fill="#22c55e"/>
<text x="1056" y="138" font-size="14" font-weight="600" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">ger apply</text>
<text x="1056" y="162" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">G-8: successful dry-run</text>
<text x="1056" y="182" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">  record within 24 hours</text>
<text x="1056" y="202" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">remediate items only</text>
<text x="1056" y="222" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">exception/defer skipped</text>
<path d="M1000,197 L1038,197" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#as)"/>
<rect x="780" y="330" width="460" height="200" rx="12" fill="#141414" stroke="#22c55e" stroke-width="1"/>
<rect x="780" y="342" width="3" height="176" rx="1.5" fill="#22c55e"/>
<text x="796" y="356" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Each item in order (chmod)</text>
<text x="796" y="380" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">1. record before (st_mode &amp; 0o7777 from lstat)</text>
<text x="796" y="400" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">2. skipped if already the target (already_compliant, idempotent)</text>
<text x="796" y="420" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">3. apply with os.chmod (no external commands)</text>
<text x="796" y="440" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">4. lstat again: check after and st_ino / st_dev</text>
<text x="796" y="460" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">mode only ^0[0-7]{3}$; setuid/setgid/sticky rejected</text>
<text x="796" y="480" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">not recursive, never reaches parent directories</text>
<path d="M1140,282 L1140,328" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="780" y="580" width="220" height="130" rx="12" fill="#0c2214" stroke="#22c55e" stroke-width="1"/>
<rect x="780" y="592" width="3" height="106" rx="1.5" fill="#22c55e"/>
<text x="796" y="606" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Success</text>
<text x="796" y="630" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">remediation-log.json</text>
<text x="796" y="650" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">result: applied / skipped</text>
<text x="796" y="670" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">exit code 0</text>
<rect x="1040" y="580" width="200" height="130" rx="12" fill="#2a0f0f" stroke="#ef4444" stroke-width="1"/>
<rect x="1040" y="592" width="3" height="106" rx="1.5" fill="#ef4444"/>
<text x="1056" y="606" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Failure → rollback</text>
<text x="1056" y="630" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">the rest is not executed</text>
<text x="1056" y="650" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">applied items undone</text>
<text x="1056" y="670" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">4=rolled back / 5=failed</text>
<path d="M890,530 L890,578" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M1140,530 L1140,578" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="1150" y="560" font-size="11" font-weight="500" fill="#ef4444" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">failed</text>
<rect x="40" y="330" width="280" height="200" rx="12" fill="#1b1430" stroke="#a78bfa" stroke-width="1"/>
<rect x="40" y="342" width="3" height="176" rx="1.5" fill="#a78bfa"/>
<text x="56" y="356" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Approval token</text>
<text x="56" y="380" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">approval_token must equal</text>
<text x="56" y="400" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">the SHA-256 of the canonical</text>
<text x="56" y="420" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">JSON of the plan (= plan_hash)</text>
<text x="56" y="440" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">replacing the plan after</text>
<text x="56" y="460" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">approval is stopped by G-3</text>
<rect x="40" y="580" width="280" height="130" rx="12" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
<rect x="40" y="592" width="3" height="106" rx="1.5" fill="#3a3a3a"/>
<text x="56" y="606" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">First version operations</text>
<text x="56" y="630" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">chmod … implemented</text>
<text x="56" y="650" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">write_config … rejected (unsupported)</text>
<text x="56" y="670" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">rotate_secret … rejected (unsupported)</text>
<rect x="40" y="742" width="1200" height="90" rx="12" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
<rect x="40" y="754" width="3" height="66" rx="1.5" fill="#3a3a3a"/>
<text x="56" y="768" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Audit log ger-audit.jsonl (append only, hash chain, separate file from ZES/ZET)</text>
<text x="56" y="792" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">skill / version / command / plan_id / plan_hash / input_hash / output_hash / started_at / finished_at / operator / result / gate_failed</text>
<text x="40" y="852" font-size="12" font-weight="400" fill="#8a8a8a" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">Legend: blue=input / yellow=dry-run / green=execution, success / red=rejection, rollback / purple=approval binding</text></svg>
