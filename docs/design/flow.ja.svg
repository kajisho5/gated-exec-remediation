<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="t d"><title id="t">GER 処理フロー</title><desc id="d">Gated-Exec Remediation: 計画・承認・許可リストをゲート G-1〜G-8 で検証し、dry-run を経て chmod を実行、失敗時は全件ロールバックする流れ</desc><defs><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs><rect width="100%" height="100%" fill="#0a0a0a"/><text x="40" y="52" font-size="24" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">GER — Gated-Exec Remediation 処理フロー</text>
<text x="40" y="80" font-size="14" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">修復層。3 層で唯一、変更を実行する。すべてのゲートを通過した操作だけを実行（初版は chmod のみ）</text>
<rect x="40" y="112" width="280" height="180" rx="12" fill="#141414" stroke="#38bdf8" stroke-width="1"/>
<rect x="40" y="124" width="3" height="156" rx="1.5" fill="#38bdf8"/>
<text x="56" y="138" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">入力 ger-input.json</text>
<text x="56" y="162" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">plan（ZET の確定計画）</text>
<text x="56" y="182" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">approval{plan_id, approved_by,</text>
<text x="56" y="202" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">  approved_at, approval_token}</text>
<text x="56" y="222" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">mode: dry-run | apply</text>
<text x="56" y="242" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">allowed_actions</text>
<text x="56" y="262" font-size="12" font-weight="400" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">--operator &lt;name&gt;（必須）</text>
<rect x="380" y="112" width="340" height="452" rx="12" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
<text x="396" y="140" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">ゲート（1 つでも失敗したら何も変更しない）</text>
<rect x="394" y="160" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="185" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-1</text>
<text x="452" y="185" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">スキーマ・版固定・findings キー禁止</text>
<path d="M550,200 L550,209" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="209" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="234" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-2</text>
<text x="452" y="234" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">plan.status が ok / partial</text>
<path d="M550,249 L550,258" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="258" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="283" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-3</text>
<text x="452" y="283" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">plan_id 一致・token == plan_hash</text>
<path d="M550,298 L550,307" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="307" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="332" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-4</text>
<text x="452" y="332" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">operator は承認者に含まれない</text>
<path d="M550,347 L550,356" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="356" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="381" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-5</text>
<text x="452" y="381" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">allowed_actions かつ GER 対応</text>
<path d="M550,396 L550,405" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="405" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="430" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-6</text>
<text x="452" y="430" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">reversible:false は承認 2 名</text>
<path d="M550,445 L550,454" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="454" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="479" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-7</text>
<text x="452" y="479" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">対象を全件事前検証（lstat）</text>
<path d="M550,494 L550,503" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="394" y="503" width="312" height="40" rx="8" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
<text x="408" y="528" font-size="12" font-weight="600" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">G-8</text>
<text x="452" y="528" font-size="12" font-weight="400" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">同一 plan の dry-run 記録（apply）</text>
<path d="M320,200 L378,200" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#as)"/>
<rect x="380" y="600" width="340" height="110" rx="12" fill="#2a0f0f" stroke="#ef4444" stroke-width="1"/>
<rect x="380" y="612" width="3" height="86" rx="1.5" fill="#ef4444"/>
<text x="396" y="626" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">拒否（終了コード 3）</text>
<text x="396" y="650" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">何も変更しない</text>
<text x="396" y="670" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">拒否したゲート番号を監査ログに記録</text>
<text x="396" y="690" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">未対応操作を含む計画は全体を拒否</text>
<path d="M550,564 L550,598" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="560" y="586" font-size="11" font-weight="500" fill="#ef4444" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">いずれか失敗</text>
<rect x="780" y="112" width="220" height="170" rx="12" fill="#141414" stroke="#eab308" stroke-width="1"/>
<rect x="780" y="124" width="3" height="146" rx="1.5" fill="#eab308"/>
<text x="796" y="138" font-size="14" font-weight="600" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">ger dry-run</text>
<text x="796" y="162" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">before / after を計算</text>
<text x="796" y="182" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">変更はしない</text>
<text x="796" y="202" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">plan_hash と input_hash</text>
<text x="796" y="222" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">  を監査ログに記録</text>
<path d="M720,180 L778,180" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#as)"/>
<text x="726" y="172" font-size="11" font-weight="500" fill="#8a8a8a" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">全通過</text>
<rect x="1040" y="112" width="200" height="170" rx="12" fill="#141414" stroke="#22c55e" stroke-width="1"/>
<rect x="1040" y="124" width="3" height="146" rx="1.5" fill="#22c55e"/>
<text x="1056" y="138" font-size="14" font-weight="600" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">ger apply</text>
<text x="1056" y="162" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">G-8: 24 時間以内の</text>
<text x="1056" y="182" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">  dry-run 成功記録</text>
<text x="1056" y="202" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">remediate の item のみ</text>
<text x="1056" y="222" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">exception/defer は skip</text>
<path d="M1000,197 L1038,197" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#as)"/>
<rect x="780" y="330" width="460" height="200" rx="12" fill="#141414" stroke="#22c55e" stroke-width="1"/>
<rect x="780" y="342" width="3" height="176" rx="1.5" fill="#22c55e"/>
<text x="796" y="356" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">各 item を順に実行（chmod）</text>
<text x="796" y="380" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">1. before を記録（lstat の st_mode &amp; 0o7777）</text>
<text x="796" y="400" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">2. 目標と同じなら skipped（already_compliant・冪等）</text>
<text x="796" y="420" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">3. os.chmod で適用（外部コマンドを使わない）</text>
<text x="796" y="440" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">4. 再 lstat で after と st_ino / st_dev 一致を確認</text>
<text x="796" y="460" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">mode は ^0[0-7]{3}$ のみ。setuid/setgid/sticky は拒否</text>
<text x="796" y="480" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">再帰なし・親ディレクトリへの遡及なし</text>
<path d="M1140,282 L1140,328" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="780" y="580" width="220" height="130" rx="12" fill="#0c2214" stroke="#22c55e" stroke-width="1"/>
<rect x="780" y="592" width="3" height="106" rx="1.5" fill="#22c55e"/>
<text x="796" y="606" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">成功</text>
<text x="796" y="630" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">remediation-log.json</text>
<text x="796" y="650" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">result: applied / skipped</text>
<text x="796" y="670" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">終了コード 0</text>
<rect x="1040" y="580" width="200" height="130" rx="12" fill="#2a0f0f" stroke="#ef4444" stroke-width="1"/>
<rect x="1040" y="592" width="3" height="106" rx="1.5" fill="#ef4444"/>
<text x="1056" y="606" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">失敗 → ロールバック</text>
<text x="1056" y="630" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">残りは実行しない</text>
<text x="1056" y="650" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">適用済みを逆順に戻す</text>
<text x="1056" y="670" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">4=戻した / 5=戻せず</text>
<path d="M890,530 L890,578" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M1140,530 L1140,578" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="1150" y="560" font-size="11" font-weight="500" fill="#ef4444" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">failed</text>
<rect x="40" y="330" width="280" height="200" rx="12" fill="#1b1430" stroke="#a78bfa" stroke-width="1"/>
<rect x="40" y="342" width="3" height="176" rx="1.5" fill="#a78bfa"/>
<text x="56" y="356" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">承認トークン</text>
<text x="56" y="380" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">approval_token は plan 本体の</text>
<text x="56" y="400" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">正規化 JSON の SHA-256</text>
<text x="56" y="420" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">（= plan_hash）と一致必須</text>
<text x="56" y="440" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">承認後に plan を差し替えると</text>
<text x="56" y="460" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">G-3 で停止する</text>
<rect x="40" y="580" width="280" height="130" rx="12" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
<rect x="40" y="592" width="3" height="106" rx="1.5" fill="#3a3a3a"/>
<text x="56" y="606" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">初版の操作</text>
<text x="56" y="630" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">chmod … 実装</text>
<text x="56" y="650" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">write_config … 拒否（未対応）</text>
<text x="56" y="670" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">rotate_secret … 拒否（未対応）</text>
<rect x="40" y="742" width="1200" height="90" rx="12" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
<rect x="40" y="754" width="3" height="66" rx="1.5" fill="#3a3a3a"/>
<text x="56" y="768" font-size="14" font-weight="600" fill="#ededed" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">監査ログ ger-audit.jsonl（追記専用・ハッシュチェーン・ZES/ZET と別ファイル）</text>
<text x="56" y="792" font-size="12" font-weight="400" fill="#a3a3a3" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">skill / version / command / plan_id / plan_hash / input_hash / output_hash / started_at / finished_at / operator / result / gate_failed</text>
<text x="40" y="852" font-size="12" font-weight="400" fill="#8a8a8a" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif" text-anchor="start">凡例: 青=入力 / 黄=dry-run / 緑=実行・成功 / 赤=拒否・ロールバック / 紫=承認の束縛</text></svg>
